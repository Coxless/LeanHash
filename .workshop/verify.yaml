# Rust -> Lean 抽出（Charon + Aeneas）を含む検証用ワークショップ（P3.5）。
# dev の全 SDK に aeneas を足したもの。初回 launch は Aeneas のビルドで時間がかかる。
#   workshop launch verify
name: verify
base: ubuntu@24.04
sdks:
  - name: project-lean
  - name: project-rust
  - name: project-bench
  - name: project-aeneas
actions:
  versions: |
    source /project/.workshop/env.sh
    lean --version; rustc --version
    charon version 2>/dev/null || charon --version
    aeneas -version 2>/dev/null || ls -l "$(command -v aeneas)"
  extract: |
    # P3.5：rust/leanhash の outer モジュール（とそこから呼ぶ核）を Charon + Aeneas で Lean に抽出し、
    # LeanHash/Aeneas/Leanhash.lean に置く。`--check` なら既存のファイルとの差分だけを見る
    source /project/.workshop/env.sh
    tmp="$(mktemp -d)"
    (cd /project/rust/leanhash && charon cargo --preset=aeneas --start-from leanhash::outer --dest-file "$tmp/leanhash.llbc")
    aeneas -backend lean -dest "$tmp" "$tmp/leanhash.llbc"
    if [ "${1:-}" = "--check" ]; then
      diff "$tmp/Leanhash.lean" /project/LeanHash/Aeneas/Leanhash.lean
    else
      cp "$tmp/Leanhash.lean" /project/LeanHash/Aeneas/Leanhash.lean
    fi
