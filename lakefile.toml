name = "LeanHash"
version = "0.1.0"
defaultTargets = ["LeanHash"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
# Reservoir（reservoir.lean-lang.org）を通さずに git から直接取る（クラウドで Reservoir が遮断されるため）
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[lean_lib]]
name = "LeanHash"

# P3：HashIR の核を Rust に出力する（`lake exe emit_rust rust/leanhash/src/kernel.rs`）
[[lean_exe]]
name = "emit_rust"
root = "LeanHash.Impl.EmitMain"

# P3：参照実装 hashCI のテストベクトル（Rust の hash_c との差分テスト用。`lake exe ref_vectors rust/leanhash/src/lean_ref_vectors.txt`）
[[lean_exe]]
name = "ref_vectors"
root = "LeanHash.Impl.RefMain"
