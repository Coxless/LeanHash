name = "LeanHash"
version = "0.1.0"
defaultTargets = ["LeanHash"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
# Reservoir（reservoir.lean-lang.org）を通さずに git から直接取る（クラウドで Reservoir が遮断されるため）
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[lean_lib]]
name = "LeanHash"
